<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>便签</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="note-card">
    <!-- 顶部拖动条 + 关闭按钮 -->
    <div class="note-header">
      <span class="note-title">📝 便签</span>
      <div class="header-btns">
        <button class="delete-btn" id="deleteBtn" title="删除便签">🗑️</button>
        <button class="close-btn" id="closeBtn">×</button>
      </div>
    </div>
    <!-- 内容区 -->
    <textarea id="note-content" placeholder="写点什么...
（内容会自动保存在本地）"></textarea>
  </div>
  <script src="script.js"></script>
</body>
</html>
