<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>倒计时</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pomo-card">
    <!-- 顶部 -->
    <div class="pomo-header">
      <span class="pomo-title">⏰ 趣宝倒计时</span>
      <div class="pomo-header-actions">
        <button class="hdr-btn minimize-btn" id="minimizeBtn" title="最小化到任务栏">─</button>
        <button class="close-btn" id="closeBtn" title="关闭">×</button>
      </div>
    </div>

    <!-- 倒计时显示 -->
    <div class="timer-display" id="timer">25:00</div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-btn active" data-mins="25">专注</button>
      <button class="mode-btn" data-mins="5">短休</button>
      <button class="mode-btn" data-mins="15">长休</button>
      <button class="mode-btn custom-btn" id="customBtn" title="自定义倒计时">自定义</button>
    </div>

    <!-- 自定义倒计时输入面板 -->
    <div class="custom-panel" id="customPanel">
      <div class="custom-row">
        <div class="spinner-group">
          <button class="spinner-btn" data-target="customHours" data-dir="1">▲</button>
          <input type="number" id="customHours" min="0" max="23" value="0" class="custom-input">
          <button class="spinner-btn" data-target="customHours" data-dir="-1">▼</button>
        </div>
        <span class="custom-label">时</span>
        <div class="spinner-group">
          <button class="spinner-btn" data-target="customMins" data-dir="1">▲</button>
          <input type="number" id="customMins" min="0" max="59" value="30" class="custom-input">
          <button class="spinner-btn" data-target="customMins" data-dir="-1">▼</button>
        </div>
        <span class="custom-label">分</span>
        <div class="spinner-group">
          <button class="spinner-btn" data-target="customSecs" data-dir="1">▲</button>
          <input type="number" id="customSecs" min="0" max="59" value="0" class="custom-input">
          <button class="spinner-btn" data-target="customSecs" data-dir="-1">▼</button>
        </div>
        <span class="custom-label">秒</span>
      </div>
      <div class="custom-actions">
        <button class="custom-cancel" id="customCancel">取消</button>
        <button class="custom-ok" id="customOk">确定</button>
      </div>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="btn-start" id="startBtn">开始</button>
      <button class="btn-reset" id="resetBtn">重置</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
