<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>绑定小程序</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bind-window">
    <!-- 小程序二维码 -->
    <div class="qr-section">
      <div class="qr-box">
        <img id="qr-img" src="../../assets/ewm.jpg" alt="小程序二维码" />
      </div>
      <p class="qr-tip">请用微信扫码打开小程序</p>
      <p class="qr-tip-sub">进入「我的→我的宠物→生成配对码」</p>
    </div>

    <!-- 未绑定状态 -->
    <div id="unbound-view" class="bind-content">
      <div class="input-area">
        <input type="text" id="code-input" placeholder="请输入6位配对码" maxlength="6" />
        <button id="bind-btn" class="btn-primary">绑定</button>
      </div>

      <div id="msg-box" class="msg-box"></div>
    </div>

    <!-- 已绑定状态 -->
    <div id="bound-view" class="bind-content" style="display:none;">
      <div class="bound-info">
        <div class="bound-icon">✅</div>
        <h3>已绑定小程序账号</h3>
        <p class="bound-user" id="bound-user"></p>
        <p class="bound-points" id="bound-points"></p>
      </div>
      <div class="bound-actions">
        <button id="sync-btn" class="btn-primary">🔄 立即同步数据</button>
        <button id="unbind-btn" class="btn-danger">解除绑定</button>
      </div>
      <div id="sync-msg" class="msg-box"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
