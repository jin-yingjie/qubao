<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>互动面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="interact-panel">
    <button class="interact-item" data-action="feed">
      <div class="interact-icon">🍚</div>
      <div class="interact-name">喂食</div>
    </button>
    <button class="interact-item" data-action="bathe">
      <div class="interact-icon">🛁</div>
      <div class="interact-name">洗澡</div>
    </button>
    <button class="interact-item" data-action="play">
      <div class="interact-icon">🎾</div>
      <div class="interact-name">玩耍</div>
    </button>
    <button class="interact-item" data-action="sleep">
      <div class="interact-icon">💤</div>
      <div class="interact-name">睡觉</div>
    </button>
    <button class="interact-item" data-action="cure">
      <div class="interact-icon">💊</div>
      <div class="interact-name">看病</div>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
